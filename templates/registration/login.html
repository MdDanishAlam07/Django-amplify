{% extends "layout.html" %}
{% block title %}Login - AmplifyX{% endblock %}

{% block content %}
  <h2>Login  Form</h2>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">
      Login
    </button>
  </form>
  <p>Dont have an account? <a href="{% url 'register' %}">Register here</a></p>
{% endblock %}
